<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12161c" />
    <meta name="description" content="Helvian brings patient workflows, appointments and care coordination into one clear operational view." />
    <meta property="og:title" content="Helvian | Clinical Operations & Patient Workflow Platform" />
    <meta property="og:description" content="A focused operational view for patient workflows, appointments and care coordination." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helvian.net" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Helvian | Clinical Operations & Patient Workflow Platform" />
    <meta name="twitter:description" content="A focused operational view for patient workflows, appointments and care coordination." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Helvian | Clinical Operations & Patient Workflow Platform</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('helvian.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
